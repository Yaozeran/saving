<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700"><rect width="1600" height="700" fill="#f7f8f3"/><text x="50" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#193e37">03  Persistent data model</text><text x="50" y="104" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#193e37">Implemented SQLite tables · PK = primary key · FK = foreign key · UQ = unique</text><rect x="50" y="150" width="425" height="205" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="70" y="193" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">audit_log</text><text x="70" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">id PK / user_id FK</text><text x="70" y="263" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">action / detail / created</text><path d="M600,260 L475,260" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="475,260 489.4071536376428,253.04055145422032 489.4071536376428,266.9594485457797" fill="#24594a"/><text x="495" y="233" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#193e37">1 : many</text><rect x="600" y="150" width="400" height="220" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="620" y="193" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">users</text><text x="620" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">id PK / email UQ</text><text x="620" y="263" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">password: salted scrypt</text><text x="620" y="293" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">role: user / admin / auditor</text><text x="620" y="323" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">wallet UQ</text><rect x="50" y="430" width="425" height="205" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="70" y="473" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">sessions</text><text x="70" y="513" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">token PK: SHA-256 hash</text><text x="70" y="543" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">user_id FK -&gt; users.id</text><text x="70" y="573" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">expires: milliseconds</text><rect x="585" y="430" width="430" height="205" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="605" y="473" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">challenges</text><text x="605" y="513" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">user_id PK / FK -&gt; users.id</text><text x="605" y="543" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">message: nonce + account</text><text x="605" y="573" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">expires: milliseconds</text><rect x="1120" y="430" width="430" height="220" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="1140" y="473" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">transactions</text><text x="1140" y="513" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">(hash, log_index) composite PK</text><text x="1140" y="543" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">user_id FK / kind / amount</text><text x="1140" y="573" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">block / block_hash / block_time</text><text x="1140" y="603" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">created: recording time</text><path d="M600,370 L260,430" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="260,430 272.97847794236355,420.64269748808005 275.39737812106586,434.34979850072654" fill="#24594a"/><text x="360" y="400" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#193e37">1 : many</text><path d="M800,370 L800,430" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="800,430 793.0405514542203,415.5928463623572 806.9594485457797,415.5928463623572" fill="#24594a"/><text x="825" y="405" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#193e37">1 : 0..1</text><path d="M1000,260 L1335,430" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="1335,430 1319.003073156421,429.6864213636437 1325.3017853964768,417.2742531258865" fill="#24594a"/><text x="1140" y="355" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#193e37">1 : many</text></svg>
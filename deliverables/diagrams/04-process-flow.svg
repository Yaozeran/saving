<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540"><rect width="1600" height="540" fill="#f7f8f3"/><text x="50" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#193e37">04  Wallet and deposit process</text><text x="50" y="104" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#193e37">Message proof and an ETH transaction are separate approvals</text><rect x="50" y="150" width="460" height="115" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="70" y="193" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">1  Sign in</text><text x="70" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">Password session</text><rect x="570" y="150" width="460" height="115" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="590" y="193" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">2  Link wallet</text><text x="590" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">Nonce + signed proof</text><rect x="1090" y="150" width="460" height="115" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="1110" y="193" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">3  Submit deposit</text><text x="1110" y="233" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">Sepolia + amount + fee</text><path d="M510,208 L570,208" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="570,208 555.5928463623571,214.95944854577968 555.5928463623571,201.04055145422032" fill="#24594a"/><path d="M1030,208 L1090,208" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="1090,208 1075.5928463623572,214.95944854577968 1075.5928463623572,201.04055145422032" fill="#24594a"/><path d="M1320,265 L1320,345" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="1320,345 1313.0405514542203,330.5928463623572 1326.9594485457797,330.5928463623572" fill="#24594a"/><rect x="1090" y="345" width="460" height="115" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="1110" y="388" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">4  Confirm on chain</text><text x="1110" y="428" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">Wait two confirmations</text><rect x="570" y="345" width="460" height="115" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="590" y="388" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">5  Verify receipt</text><text x="590" y="428" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">API checks event + wallet</text><rect x="50" y="345" width="460" height="115" rx="16" fill="white" stroke="#cbd6c8" stroke-width="2"/><text x="70" y="388" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#193e37">6  Store and refresh</text><text x="70" y="428" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#193e37">Journal + live balances</text><path d="M1090,402 L1030,402" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="1030,402 1044.4071536376428,395.0405514542203 1044.4071536376428,408.9594485457797" fill="#24594a"/><path d="M570,402 L510,402" fill="none" stroke="#24594a" stroke-width="4"/><polygon points="510,402 524.4071536376429,395.0405514542203 524.4071536376429,408.9594485457797" fill="#24594a"/><text x="50" y="512" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#193e37">On failure: retain hash, inspect explorer, retry import after confirmation. No fabricated success.</text></svg>